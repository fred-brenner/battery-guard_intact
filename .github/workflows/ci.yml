name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    # Minimal token scope: the job only reads the repo (checkout) and
    # uploads an artifact; no write access is needed.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # We only read the repo (never push), so drop the token from the
          # git config after checkout.
          persist-credentials: false

      # Installs the JDK and Gradle pinned in mise.toml. The action caches
      # the mise install directory, keyed on the hash of mise.toml.
      - name: Install toolchain (mise)
        uses: jdx/mise-action@b44d12e7d0d8ee7461bb893e1b1993500433185b # v5.2.7

      - name: Set JAVA_HOME from mise
        run: echo "JAVA_HOME=$(mise where java)" >> "$GITHUB_ENV"

      - name: Cache Gradle dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.gradle/caches
          key: gradle-deps-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle.properties') }}
          restore-keys: |
            gradle-deps-${{ runner.os }}-

      # AGP 9.5 defaults: build-tools 36.0.0; compileSdk 36.
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Space-separated sdkmanager packages. setup-android already
          # installs the cmdline-tools, so they are not listed here.
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Run unit tests
        run: gradle testDebugUnitTest

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
